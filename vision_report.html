<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>セッションレポート</title>
<style>
[hidden] { display: none !important; }
:root {
  --text: #0b2545;
  --text-2: #3d5673;
  --muted: #6b7f95;
  --surface: #ffffff;
  --line: #d3e6f8;
  --grid: #e6edf4;
  --axis: #c3cfdb;
  --grad: linear-gradient(135deg, #22d3ee 0%, #3b82f6 55%, #6366f1 100%);
  /* 积极/消极 = 发散色对(蓝↔红,已用 validate_palette 校验) */
  --pos: #2a78d6;
  --neg: #e34948;
  /* 状态色(固定,始终配图标+文字) */
  --good: #0ca30c;
  --warning: #fab219;
  --critical: #d03b3b;
  --good-bg: #e7f7e7;
  --warning-bg: #fff5dc;
  --critical-bg: #fde8e8;
  --none-bg: #f1f4f7;
  --dot: #3d5673;
  --shadow: 0 10px 30px rgba(29, 108, 210, .10), 0 2px 6px rgba(29, 108, 210, .06);
  --font: "Noto Sans JP", "Yu Gothic UI", "Meiryo", "Microsoft YaHei UI", "Microsoft YaHei", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  color: var(--text); font: 14px/1.55 var(--font); -webkit-font-smoothing: antialiased;
  background-color: #e2f1ff;
  background-image:
    radial-gradient(1100px 640px at -5% -10%, #8fd8ff 0%, rgba(143, 216, 255, 0) 62%),
    radial-gradient(950px 660px at 105% -5%, #b9b4ff 0%, rgba(185, 180, 255, 0) 60%),
    linear-gradient(160deg, #e6f6ff 0%, #f2f8ff 50%, #e4eeff 100%);
  background-attachment: fixed;
}
button { font: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid rgba(59, 130, 246, .45); outline-offset: 2px; }

.wrap { max-width: 1280px; margin: 0 auto; padding: 20px 20px 40px; }
.top {
  display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; margin-bottom: 18px;
}
.brand-mark {
  width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; flex: none;
  background: var(--grad); color: #fff; font-size: 20px; box-shadow: 0 6px 16px rgba(59, 130, 246, .35);
}
.ttl { min-width: 0; flex: 1; }
.ttl h1 { margin: 0; font-size: 22px; line-height: 1.25; }
.ttl .meta { color: var(--muted); font-size: 13px; }
.sample {
  display: inline-block; margin-left: 8px; vertical-align: 3px; font-size: 11px; font-weight: 700;
  padding: 2px 8px; border-radius: 999px; background: #fff4e0; color: #9a5b06; border: 1px solid #fcd9a5;
}
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn {
  display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 10px;
  border: 1px solid #b5d4f1; background: #fff; color: #1e4a7a; font-weight: 700;
}
.btn:hover { background: #f3f9ff; border-color: #7cb7ff; }
.btn.primary { background: var(--grad); color: #fff; border: 0; box-shadow: 0 6px 16px rgba(59, 130, 246, .3); }
.lang { display: flex; border: 1px solid #b5d4f1; border-radius: 10px; overflow: hidden; background: #fff; }
.lang button { background: none; border: 0; padding: 7px 11px; color: var(--muted); font-size: 12px; }
.lang button[aria-pressed="true"] { background: var(--grad); color: #fff; font-weight: 700; }

/* 卡片栅格 */
.grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 16px; }
.card {
  background: rgba(255, 255, 255, .9); border: 1px solid rgba(255, 255, 255, .95); border-radius: 16px;
  box-shadow: var(--shadow); padding: 16px 18px; min-width: 0; break-inside: avoid;
}
.s3 { grid-column: span 3; } .s4 { grid-column: span 4; } .s5 { grid-column: span 5; }
.s6 { grid-column: span 6; } .s7 { grid-column: span 7; } .s8 { grid-column: span 8; } .s12 { grid-column: span 12; }
.card h2 { margin: 0; font-size: 15px; display: flex; align-items: center; gap: 8px; }
.card h2::before { content: ""; width: 4px; height: 16px; border-radius: 2px; background: var(--grad); flex: none; }
.card .sub { color: var(--muted); font-size: 12px; margin: 2px 0 10px 12px; }

/* 关键指标 */
.kpi .lbl { color: var(--muted); font-size: 12px; font-weight: 700; }
.kpi .val { font-size: 34px; font-weight: 800; line-height: 1.15; margin-top: 4px; }
.kpi .val small { font-size: 15px; font-weight: 700; color: var(--text-2); margin-left: 2px; }
.kpi .note { color: var(--text-2); font-size: 12px; margin-top: 4px; }
.kpi .note .icon { font-weight: 800; }

/* 图例 */
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--text-2); margin: 0 0 6px 12px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }

/* 图表 */
.chart { position: relative; width: 100%; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { font-family: var(--font); }
.tick { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.axlbl { fill: var(--text-2); font-size: 12px; }
.vlabel { fill: var(--text); font-size: 12px; font-weight: 700; }
.hit { fill: transparent; cursor: default; outline: none; }
.hit:focus-visible { stroke: #3b82f6; stroke-width: 2; }
.tip {
  position: fixed; z-index: 30; pointer-events: none; padding: 8px 10px; border-radius: 10px;
  background: #0b2545; color: #fff; font-size: 12px; line-height: 1.45; box-shadow: 0 10px 24px rgba(11, 37, 69, .3);
  opacity: 0; transition: opacity .12s; max-width: 260px;
}
.tip.show { opacity: 1; }
.tip b { font-weight: 800; }
.tip .k { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }

/* 评判矩阵 */
.matrix { width: 100%; border-collapse: separate; border-spacing: 4px; }
.matrix th { font-size: 12px; color: var(--muted); font-weight: 700; text-align: center; padding: 2px; }
.matrix th.row { text-align: left; color: var(--text); white-space: nowrap; }
.matrix td { border-radius: 10px; padding: 8px 6px; text-align: center; font-size: 12px; font-weight: 700; line-height: 1.3; }
.matrix td .ic { display: block; font-size: 16px; line-height: 1; margin-bottom: 3px; }
.c-ok { background: var(--good-bg); color: #075f07; }
.c-ok .ic { color: var(--good); }
.c-issue { background: var(--warning-bg); color: #7a4a00; }
.c-issue .ic { color: #c98500; }
.c-still { background: var(--critical-bg); color: #8f1f1f; }
.c-still .ic { color: var(--critical); }
.c-none { background: var(--none-bg); color: var(--muted); font-weight: 400; }
.mx-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--text-2); margin-top: 8px; }

/* 表格 */
.tbl-wrap { overflow-x: auto; }
table.data { width: 100%; border-collapse: collapse; font-size: 13px; }
table.data th {
  text-align: left; font-size: 12px; color: var(--muted); font-weight: 700; padding: 8px 10px;
  border-bottom: 1px solid var(--line); white-space: nowrap;
}
table.data td { padding: 9px 10px; border-bottom: 1px solid #edf3f9; vertical-align: middle; }
table.data td.num, table.data th.num { text-align: right; font-variant-numeric: tabular-nums; }
table.data tr:last-child td { border-bottom: 0; }
.who {
  display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%;
  background: var(--grad); color: #fff; font-size: 12px; font-weight: 800; margin-right: 8px;
}
.flag {
  display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700;
  padding: 2px 8px; border-radius: 999px; background: var(--critical-bg); color: #8f1f1f;
}
.okflag { background: var(--good-bg); color: #075f07; }
.kind { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.kind.still { background: var(--critical-bg); color: #8f1f1f; }
.kind.issue { background: var(--warning-bg); color: #7a4a00; }
.kind.praise { background: var(--good-bg); color: #075f07; }

details.dt { margin-top: 8px; }
details.dt summary { cursor: pointer; color: #2563eb; font-size: 12px; font-weight: 700; margin-left: 12px; }
details.dt table { margin-top: 6px; }

.callout {
  display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: 12px;
  background: linear-gradient(135deg, #fff1f2 0%, #ffe9ec 100%); border: 1px solid #fecdd3; margin-top: 10px;
}
.callout .ic { font-size: 20px; line-height: 1.2; }
.callout b { color: #9f1239; }
.notes { color: var(--text-2); font-size: 12px; margin: 0; padding-left: 18px; }
.notes li + li { margin-top: 4px; }
.footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 18px; }

@media (max-width: 980px) {
  .s3 { grid-column: span 6; } .s4, .s5, .s6, .s7, .s8 { grid-column: span 12; }
}
@media (max-width: 560px) {
  .wrap { padding: 14px 16px 32px; }
  .s3 { grid-column: span 12; }
  .ttl h1 { font-size: 18px; }
}
@media print {
  body { background: #fff; }
  .actions, .lang, details.dt summary { display: none !important; }
  details.dt { display: none; }
  .card { box-shadow: none; border: 1px solid #dfe7ef; }
  .wrap { padding: 0; max-width: none; }
  .tip { display: none; }
  @page { size: A4; margin: 12mm; }
}

/* Readable audit tables and consistent controls. */
.brand-mark {width:145px;height:auto;display:block;object-fit:contain;mix-blend-mode:multiply;background:none;box-shadow:none;border-radius:0;}
:root { --font: "Segoe UI", "Yu Gothic UI", "Meiryo", "Microsoft YaHei UI", sans-serif; }
.btn { border-radius:8px; min-height:38px; font-size:13px; font-weight:600; text-decoration:none; box-shadow:0 1px 3px #1234560a; }
.btn.primary { background:linear-gradient(115deg,#139abf,#2674cc 65%,#5361c3); box-shadow:0 3px 8px #2674cc25; }
.card { box-shadow:0 5px 18px #2345670d; border-color:#dbe6f0; }
#real-evidence table, #event-evidence table, #tb-speak table { min-width:850px; }
#real-evidence td, #event-evidence td, #tb-speak td { white-space:normal; max-width:300px; min-width:90px; overflow-wrap:anywhere; line-height:1.8; vertical-align:top; padding:12px; }
#real-evidence td:first-child, #event-evidence td:first-child { font:12px/1.8 Consolas,monospace; }
#event-evidence details { margin-top:20px; }
#event-evidence summary { padding:10px 0; cursor:pointer; font-weight:600; }
@media print { #real-evidence table,#event-evidence table,#tb-speak table { min-width:0; font-size:10px; } }
</style>
</head>

/* ================= 派生统计 ================= */
function stats() {
  const per = REPORT.participants.map((p) => {
    const a = REPORT.affects[p.letter] || {};
    const pos = AFFECT_KEYS.filter((k) => POSITIVE.has(k)).reduce((s, k) => s + (a[k] || 0), 0);
    const neg = AFFECT_KEYS.filter((k) => !POSITIVE.has(k)).reduce((s, k) => s + (a[k] || 0), 0);
    const main = AFFECT_KEYS.slice().sort((x, y) => (a[y] || 0) - (a[x] || 0))[0];
    const j = REPORT.judgments[p.letter] || {};
    const okN = JUDGED.filter((k) => j[k] && j[k].r === "ok").length;
    const stillN = JUDGED.filter((k) => j[k] && j[k].r === "still").length;
    return { ...p, pos, neg, n: pos + neg, rate: pos + neg ? pos / (pos + neg) : null, main, okN, stillN,
      follow: REPORT.follow_up.includes(p.letter) };
  });
  const totPos = per.reduce((s, x) => s + x.pos, 0), totN = per.reduce((s, x) => s + x.n, 0);
  const affectTot = Object.fromEntries(AFFECT_KEYS.map((k) => [k, per.reduce((s, x) => s + ((REPORT.affects[x.letter] || {})[k] || 0), 0)]));
  const stills = [];
  for (const p of REPORT.participants) for (const k of JUDGED) {
    const j = (REPORT.judgments[p.letter] || {})[k]; if (j && j.r === "still") stills.push({ who: p.letter, sec: k });
  }
  return { per, totPos, totN, rate: totN ? totPos / totN : null, affectTot, stills };
}

function barPath(x, y, w, h, dir) {
  const r = Math.max(0, Math.min(4, w / 2, h / 2));
  if (h <= 0 || w <= 0) return "";
  if (dir === "up") return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`;
  if (dir === "down") return `M${x},${y}V${y + h - r}Q${x},${y + h} ${x + r},${y + h}H${x + w - r}Q${x + w},${y + h} ${x + w},${y + h - r}V${y}Z`;
  return `M${x},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h - r}Q${x + w},${y + h} ${x + w - r},${y + h}H${x}Z`;

const tip = $("tip");

  const show = (e) => {

    const x = e && e.clientX != null ? e.clientX : r.left + r.width / 2;
    const y = e && e.clientY != null ? e.clientY : r.top;
    const w = tip.offsetWidth, h = tip.offsetHeight;
    tip.style.left = Math.min(window.innerWidth - w - 8, Math.max(8, x + 12)) + "px";
    tip.style.top = Math.max(8, y - h - 12) + "px";
  };
  target.addEventListener("mousemove", show);
  target.addEventListener("focus", () => show(null));
  target.addEventListener("mouseleave", () => tip.classList.remove("show"));

  // 上下两半用同一比例尺,但各按自己的最大值分配高度(消极很少时不浪费下半区)
  const posMax = niceMax(Math.max(...REPORT.sections.map((s) => s.pos)), 4);
  const negMax = niceMax(Math.max(...REPORT.sections.map((s) => s.neg)), 4);
  const iw = W - m.l - m.r, ih = H - m.t - m.b - 16;
  const unit = ih / (posMax + negMax), y0 = m.t + posMax * unit;
  const ys = (v) => v * unit;
  const ticks = [posMax, posMax / 2, 0, -negMax];
  for (const v of ticks) {
    const y = y0 - ys(v);
    el("line", { x1: m.l, x2: W - m.r, y1: y, y2: y, stroke: v === 0 ? css("--axis") : css("--grid"), "stroke-width": 1 }, svg);
    el("text", { x: m.l - 6, y: y + 4, "text-anchor": "end", class: "tick" }, svg).textContent = Math.abs(v);

/* ================= 图 2:每人积极率(横向柱 + 平均线) ================= */

  const iw = W - m.l - m.r, xs = (v) => m.l + v * iw;
  for (const v of [0, .25, .5, .75, 1]) {
    el("line", { x1: xs(v), x2: xs(v), y1: m.t - 4, y2: H - m.b, stroke: v === 0 ? css("--axis") : css("--grid") }, svg);
    el("text", { x: xs(v), y: H - 6, "text-anchor": "middle", class: "tick" }, svg).textContent = pct(v) + "%";
  }

    const y = m.t + i * rowH + 7, bh = rowH - 16;
    el("text", { x: m.l - 10, y: y + bh / 2 + 4, "text-anchor": "end", class: "axlbl" }, svg).textContent = whoLabel(p.letter);
    el("path", { d: barPath(xs(0) + 1, y, Math.max(0, xs(p.rate) - xs(0) - 1), bh, "right"), fill: css("--pos"), class: "mark" }, svg);
    el("text", { x: xs(p.rate) + 6, y: y + bh / 2 + 4, class: "vlabel" }, svg).textContent = pct(p.rate) + "%";
    const hit = el("rect", { x: 0, y: m.t + i * rowH, width: W, height: rowH, class: "hit" }, svg);
    bindTip(hit, `<b>${esc(whoLabel(p.letter))}</b><br>${esc(t("pos"))} ${p.pos} · ${esc(t("neg"))} ${p.neg}<br>${esc(t("ratio"))} ${pct(p.rate)}%`);
  });
  // 全场平均参考线(实线 hairline + 文字)
  const ax = xs(S.rate);
  el("line", { x1: ax, x2: ax, y1: m.t - 6, y2: H - m.b, stroke: css("--text-2"), "stroke-width": 1.5 }, svg);
  el("text", { x: ax, y: m.t - 10, "text-anchor": "middle", class: "tick", style: "fill:" + css("--text-2") }, svg).textContent = t("avg", { p: pct(S.rate) });

/* ================= 评判矩阵(状态色 + 图标 + 文字) ================= */
function drawMatrix() {
  const head = `<tr><th></th>${REPORT.sections.map((s) => `<th>${s.no}<br><span style="font-weight:400">${esc(secName(s.key))}</span></th>`).join("")}</tr>`;
  const body = REPORT.participants.map((p) => {
    const j = REPORT.judgments[p.letter] || {};
    return `<tr><th class="row"><span class="who">${esc(p.letter)}</span>${esc(p.nickname)}</th>${REPORT.sections.map((s) => {
      if (!s.judged) return `<td class="c-none">—</td>`;
      const c = j[s.key];
      if (!c) return `<td class="c-none">—</td>`;
      if (c.r === "unknown") return `<td class="c-none">—</td>`;
      if (c.r === "ok") return `<td class="c-ok"><span class="ic">✓</span>${esc(t("ok"))}</td>`;
      if (c.r === "still") return `<td class="c-still"><span class="ic">✕</span>${esc(t("still"))}</td>`;
      return `<td class="c-issue"><span class="ic">△</span>${esc(L().issues[c.issue] || t("issue"))}</td>`;
    }).join("")}</tr>`;
  }).join("");
  $("matrix").innerHTML = head + body;
  $("mx-legend").innerHTML = [["c-ok", "✓", t("ok")], ["c-issue", "△", t("issue")], ["c-still", "✕", t("still")], ["c-none", "—", t("none")]]
    .map(([c, ic, txt]) => `<span><span class="${c}" style="display:inline-block;border-radius:6px;padding:0 6px;margin-right:6px;font-weight:800">${ic}</span>${esc(txt)}</span>`).join("");
}

/* ================= 图 3:PGC-ARS 六类(横向柱,积极蓝/消极红) ================= */
function drawAffect(S) {
  const box = $("ch-affect"); box.innerHTML = "";
  const W = Math.max(300, box.clientWidth), rowH = 32, m = { t: 6, r: 40, b: 24, l: 112 };
  const H = m.t + AFFECT_KEYS.length * rowH + m.b;
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": t("c_affect") }, box);
  const max = niceMax(Math.max(...Object.values(S.affectTot)), 5);
  const iw = W - m.l - m.r, xs = (v) => m.l + (v / max) * iw;
  for (let v = 0; v <= max; v += max / 5) {
    el("line", { x1: xs(v), x2: xs(v), y1: m.t, y2: H - m.b, stroke: v === 0 ? css("--axis") : css("--grid") }, svg);
    el("text", { x: xs(v), y: H - 6, "text-anchor": "middle", class: "tick" }, svg).textContent = v;
  }
  const total = Object.values(S.affectTot).reduce((a, b) => a + b, 0);
  AFFECT_KEYS.forEach((k, i) => {
    const y = m.t + i * rowH + 6, bh = rowH - 12, v = S.affectTot[k];
    const color = POSITIVE.has(k) ? css("--pos") : css("--neg");
    el("text", { x: m.l - 10, y: y + bh / 2 + 4, "text-anchor": "end", class: "axlbl" }, svg).textContent = `${AFFECT_EMOJI[k]} ${L().affects[k]}`;
    if (v > 0) el("path", { d: barPath(xs(0) + 1, y, Math.max(0, xs(v) - xs(0) - 1), bh, "right"), fill: color, class: "mark" }, svg);
    el("text", { x: xs(v) + 6, y: y + bh / 2 + 4, class: "vlabel" }, svg).textContent = v;
    const hit = el("rect", { x: 0, y: m.t + i * rowH, width: W, height: rowH, class: "hit" }, svg);

    bindTip(hit, `<b>${AFFECT_EMOJI[k]} ${esc(L().affects[k])}</b> (${esc(POSITIVE.has(k) ? t("pos") : t("neg"))})<br>${v} / ${total} (${total ? pct(v / total) : 0}%)<br>${esc(byPerson)}`);

}

/* ================= 图 4:运动量分数(点图 + 判定线;低于线 = 状态红 + ✕) ================= */
function drawMotion() {
  const box = $("ch-motion"); box.innerHTML = "";
  const W = Math.max(320, box.clientWidth), rowH = 44, m = { t: 26, r: 24, b: 28, l: 110 };
  const H = m.t + REPORT.participants.length * rowH + m.b;
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": t("c_motion") }, box);
  const max = 20, iw = W - m.l - m.r, xs = (v) => m.l + (Math.min(v, max) / max) * iw;
  const th = REPORT.still_threshold;
  // 判定线以下区域:淡红底
  el("rect", { x: xs(0), y: m.t - 6, width: xs(th) - xs(0), height: H - m.b - m.t + 6, fill: css("--critical-bg") }, svg);
  for (let v = 0; v <= max; v += 5) {
    el("line", { x1: xs(v), x2: xs(v), y1: m.t - 6, y2: H - m.b, stroke: v === 0 ? css("--axis") : css("--grid") }, svg);
    el("text", { x: xs(v), y: H - 8, "text-anchor": "middle", class: "tick" }, svg).textContent = v;
  }
  el("line", { x1: xs(th), x2: xs(th), y1: m.t - 6, y2: H - m.b, stroke: css("--critical"), "stroke-width": 1.5 }, svg);
  el("text", { x: xs(th) + 6, y: m.t - 10, class: "tick", style: "fill:" + css("--critical") + ";font-weight:700" }, svg).textContent = t("threshold", { v: th.toFixed(1) });
  REPORT.participants.forEach((p, i) => {
    const cy = m.t + i * rowH + rowH / 2;
    el("line", { x1: m.l, x2: W - m.r, y1: cy, y2: cy, stroke: css("--grid") }, svg);
    el("text", { x: m.l - 10, y: cy + 4, "text-anchor": "end", class: "axlbl" }, svg).textContent = whoLabel(p.letter);
    const j = REPORT.judgments[p.letter] || {};
    // 同一行的点按分数排开,标签放点上方,避免重叠
    JUDGED.forEach((k) => {
      const c = j[k]; if (!c || !Number.isFinite(c.m)) return;
      const x = xs(c.m), below = c.m < th;
      const g = el("g", {}, svg);
      el("circle", { cx: x, cy, r: 9, fill: below ? css("--critical") : css("--dot"), stroke: "#fff", "stroke-width": 2, class: "mark" }, g);
      el("text", { x, y: cy + 4, "text-anchor": "middle", style: "fill:#fff;font-size:10px;font-weight:800" }, g).textContent = below ? "✕" : secNo(k);
      // 只给低于判定线的点加文字(节号 + 分数);其余点的节号已写在点内
      if (below) el("text", { x, y: cy - 14, "text-anchor": "middle", class: "tick", style: "fill:" + css("--critical") + ";font-weight:700" }, g).textContent = `${secNo(k)} ${c.m.toFixed(1)}`;
      const hit = el("circle", { cx: x, cy, r: 14, class: "hit" }, g);
      const res = c.r === "ok" ? t("ok") : c.r === "still" ? t("still") : (L().issues[c.issue] || t("issue"));
      bindTip(hit, `<b>${esc(whoLabel(p.letter))}</b> · ${esc(secNo(k))} ${esc(secName(k))}<br>${esc(t("score"))} ${c.m.toFixed(1)}<br>${esc(res)}`);
    });
  });
  $("tb-motion").innerHTML = table([t("participant"), ...JUDGED.map((k) => `${secNo(k)} ${esc(secName(k))}`)],
    REPORT.participants.map((p) => [esc(whoLabel(p.letter)), ...JUDGED.map((k) => {
      const c = (REPORT.judgments[p.letter] || {})[k]; return c && Number.isFinite(c.m) ? (c.m < th ? `✕ ${c.m.toFixed(1)}` : c.m.toFixed(1)) : "—";
    })]), [1, 2, 3]);
  const who = REPORT.follow_up.map((l) => whoLabel(l)).join("、");
  $("callout").innerHTML = `<span class="ic">💬</span><div>${t("callout", { who: esc(who) })}</div>`;
  $("callout").style.display = REPORT.follow_up.length ? "" : "none";
}

/* ================= 下载 ================= */
function download(name, mime, text) {
  const blob = new Blob([text], { type: mime });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function toCsv() {
  const S = stats();
  const q = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const lines = [];
  lines.push(["section", "participant", "nickname", "samples", "positive", "negative", "positive_rate",
    ...AFFECT_KEYS.map((k) => "affect_" + I18N.en.affects[k].toLowerCase()),
    ...JUDGED.flatMap((k) => [`${k}_result`, `${k}_motion`]), "follow_up"].map(q).join(","));
  for (const p of S.per) {
    const j = REPORT.judgments[p.letter] || {};
    lines.push(["participants", p.letter, p.nickname, p.n, p.pos, p.neg, p.n?p.rate.toFixed(3):"",
      ...AFFECT_KEYS.map((k) => (REPORT.affects[p.letter] || {})[k] ?? ""),
      ...JUDGED.flatMap((k) => j[k] ? [j[k].r === "issue" ? `issue:${j[k].issue}` : j[k].r, j[k].m] : ["", ""]),
      p.follow ? "yes" : "no"].map(q).join(","));
  }
  lines.push("");
  lines.push(["section", "time", "section_key", "participant", "kind", "text", "status", "output", "utterance_id", "observation_id", "feedback_id"].map(q).join(","));
  for (const x of REPORT.spoken) lines.push([REPORT.sample?"spoken":"speech_receipt", x.t, x.section, x.name, x.kind, x.text, x.status, x.output, x.utterance_id, x.observation_id, x.feedback_id].map(q).join(","));
  if (!REPORT.sample) {
    lines.push('');
    lines.push(['session_id','source_file','observation_id','section','participant','captured_at_utc','status','box','motion_score'].map(q).join(','));
    for (const sec of REPORT.raw_record.sections || []) for (const r of sec.results?.length ? sec.results : [{}]) {
      lines.push([REPORT.session_id, REPORT.source_file, sec.observation_id, sec.section, r.name,
        (sec.captured_at || []).map(t=>new Date(t*1000).toISOString()).join(' / '), sec.status,
        r.box ? JSON.stringify(r.box) : '', r.motion_score].map(q).join(','));
    }
  }
  if (!REPORT.sample) {
    lines.push('');
    lines.push(['session_id','sample_id','captured_at','section','participant','affect','status','box','evidence'].map(q).join(','));
    for (const a of REPORT.affect_samples||[]) for (const p of a.people?.length?a.people:[{}]) lines.push([REPORT.session_id,a.sample_id,a.captured_at,a.section,p.name,p.affect,a.status,JSON.stringify(p.box||null),(a.evidence||[]).join(' / ')].map(q).join(','));
    lines.push('');
    lines.push(['session_id','utterance_id','feedback_id','observation_id','time','status','output','text','reason'].map(q).join(','));
    for (const e of REPORT.events||[]) if(e.event_type==='speech') lines.push([REPORT.session_id,e.utterance_id,e.feedback_id,e.observation_id,e.at,e.status,e.output,e.text,e.error||e.reason||e.confirmation].map(q).join(','));
  }
  return "﻿" + lines.join("\r\n");   // BOM:Excel 直接打开不乱码
}

 document.querySelector('[data-i18n="t_people_sub"]').textContent=R.people;
 document.querySelector('[data-i18n="t_speak"]').textContent=({ja:'音声・声かけの履歴',zh:'语音与反馈回执',en:'Speech and feedback receipts'})[lang];
 document.querySelector('[data-i18n="t_speak_sub"]').textContent=R.speech;
 $('tb-speak').innerHTML=table([t('col_time'),t('col_who'),t('col_sec'),R.status,t('col_text'),'Observation / Utterance'],REPORT.spoken.map(x=>[esc(eventTime(x.t)),esc(x.name||'—'),esc(secNo(x.section)),esc(receiptStatus(x.status))+(x.linked===false?' · ⚠ ID mismatch':''),esc(x.text),esc((x.observation_id||'—')+' / '+(x.utterance_id||'—'))]));
 $('tb-people').innerHTML=table([t('col_who'),t('col_samples'),t('col_pos'),t('col_main'),t('col_judge'),t('col_follow')],S.per.map(p=>[esc(whoLabel(p.letter)),p.n+' / '+({ja:'不明 ',zh:'未知 ',en:'unknown '})[lang]+(REPORT.affect_unknowns[p.letter]||0),p.n?pct(p.rate)+'%':'—',p.n?esc(L().affects[p.main]):'—',p.okN+' / '+Object.keys(REPORT.judgments[p.letter]||{}).length,p.follow?esc(t('follow')):'—']));
 $('callout').textContent=REPORT.follow_up.map(whoLabel).join(', ')+': '+R.follow;
 $('notes').innerHTML='<li>'+esc(R.note)+'</li><li>'+esc(R.speech)+'</li>';
 modeLink.textContent=R.sample; modeLink.href='/report?mode=sample&lang='+lang;
 let detail=document.getElementById('real-evidence');
 if (!detail) {detail=document.createElement('section');detail.id='real-evidence';detail.className='card s12';document.querySelector('main').appendChild(detail);}
 const rows=[];
 for(const section of REPORT.raw_record.sections||[]) {
   const rs=section.results||[];
   for(const result of rs.length?rs:[{}]) rows.push([esc(section.observation_id||'—'),esc(section.section),esc(result.name||'—'),esc(section.status||'legacy'),esc((section.captured_at||[]).map(t=>new Date(t*1000).toISOString()).join(' / ')||'—'),esc(JSON.stringify(result.box||null)),Number.isFinite(result.motion_score)?result.motion_score.toFixed(2):'—']);
 }
 detail.innerHTML='<h2>'+esc(R.evidence)+'</h2><div class="tbl-wrap">'+table(['Observation ID',t('col_sec'),t('col_who'),R.status,'Captured at (UTC)','Box [0–1000]',t('score')],rows)+'</div>';
 for(const section of REPORT.raw_record.sections||[]) {
   const pictures=(section.evidence||[]).filter(n=>/^[a-f0-9]{32}_\d+_\d+\.jpg$/.test(n));
   if(!pictures.length) continue;
   const block=document.createElement('details');
   block.innerHTML='<summary>'+esc(section.observation_id)+' · '+esc(section.section)+'</summary>'+pictures.map(n=>'<a href="/evidence/'+encodeURIComponent(n)+'" target="_blank"><img style="width:30%;height:auto;margin:1%" alt="Captured evidence" src="/evidence/'+encodeURIComponent(n)+'"></a>').join('');
   detail.appendChild(block);
 }
}

const RECEIPT_LABELS = {
 ja:{queued:'待機中',synthesizing:'音声合成中',playing:'再生処理中',completed:'PC再生完了',robot_sent:'G1受信済・完了未確認',interrupted:'中断',failed:'失敗',skipped:'スキップ',fallback:'PCへ切替',subtitle_only:'字幕のみ',planned_not_confirmed:'予定・再生記録なし'},
 zh:{queued:'已排队',synthesizing:'合成中',playing:'播放处理中',completed:'本机播放完成',robot_sent:'G1已接收·完成未确认',interrupted:'已中断',failed:'失败',skipped:'已跳过',fallback:'回退本机',subtitle_only:'仅字幕',planned_not_confirmed:'待播·无播放记录'},
 en:{queued:'Queued',synthesizing:'Synthesizing',playing:'Playback in progress',completed:'Local playback completed',robot_sent:'G1 received; completion unconfirmed',interrupted:'Interrupted',failed:'Failed',skipped:'Skipped',fallback:'Local fallback',subtitle_only:'Subtitles only',planned_not_confirmed:'Planned; no playback receipt'}
};
const receiptStatus=s=>RECEIPT_LABELS[lang][s]||s||'—';
const eventTime=x=>typeof x==='number'?new Date(x*1000).toLocaleString({ja:'ja-JP',zh:'zh-CN',en:'en-GB'}[lang]):x||'—';
function renderEventDetails() {
 const R=REAL_TEXT[lang];
 let box=$('event-evidence');
 if(!box){box=document.createElement('section');box.id='event-evidence';box.className='card s12';document.querySelector('main').appendChild(box);}
 const rows=[];
 for(const sample of REPORT.affect_samples||[]) {
   for(const p of sample.people?.length?sample.people:[{}]) rows.push([
     esc(sample.sample_id),esc(eventTime(sample.captured_at)),esc(sample.section||'—'),esc(p.name||'—'),
     esc(L().affects[p.affect]||'—'),esc(sample.status),esc(JSON.stringify(p.box||null)),
     (sample.evidence||[]).filter(n=>/^[a-f0-9]{32}_\d+_\d+\.jpg$/.test(n)).map(n=>'<a target="_blank" href="/evidence/'+encodeURIComponent(n)+'">↗ '+esc(n)+'</a>').join('<br>')||'—']);
 }
 const labels={ja:['表情サンプルの記録','音声イベント（時系列）'],zh:['表情采样明细','语音事件时间线'],en:['Expression sample records','Speech event timeline']}[lang];
 box.innerHTML='<h2>'+labels[0]+'</h2><div class="tbl-wrap">'+table(['Sample ID',t('col_time'),t('col_sec'),t('col_who'),t('col_main'),R.status,'Box','Evidence'],rows)+'</div>';
 const speechEvents=(REPORT.events||[]).filter(e=>e.event_type==='speech');
 box.innerHTML+='<details><summary>'+labels[1]+'</summary><div class="tbl-wrap">'+table(['Utterance / Feedback',t('col_time'),R.status,'Output',t('col_text'),'Detail'],speechEvents.map(e=>[
   esc(e.utterance_id+' / '+(e.feedback_id||'—')),esc(eventTime(e.at)),esc(receiptStatus(e.status)),esc(e.output||'—'),esc(e.text),esc(e.error||e.reason||e.confirmation||'—')]))+'</div></details>';
}

const modeLink=document.createElement('a');modeLink.className='btn';
modeLink.href=params.get('mode')==='sample'?'/report?lang='+lang:'/report?mode=sample&lang='+lang;
modeLink.textContent=REAL_TEXT[lang][params.get('mode')==='sample'?'real':'sample'];
document.querySelector('header').appendChild(modeLink);
const refreshReport=document.createElement('button');refreshReport.className='btn';refreshReport.type='button';
refreshReport.textContent=({ja:'記録を更新',zh:'刷新记录',en:'Refresh record'})[lang];
refreshReport.hidden=params.get('mode')==='sample';refreshReport.addEventListener('click',()=>boot());
document.querySelector('header').appendChild(refreshReport);
let pinnedRecord=params.get('id');let initialExport=true;
async function boot() {
 document.querySelector('main').hidden=true;
 for(const id of ['btn-pdf','btn-csv','btn-json']) $(id).disabled=true;
 if(params.get('mode')==='sample') REPORT=SAMPLE_REPORT;
 else {
   try {
     const id=pinnedRecord;
     const res=await fetch('/api/report'+(id?'?id='+encodeURIComponent(id):''),{cache:'no-store'});
     if(!res.ok) throw Error(res.status===404?'empty':'failed');
     REPORT=await res.json();
     if(REPORT.sample!==false || !REPORT.raw_record) throw Error('failed');
     pinnedRecord=REPORT.source_file;
   } catch(e) {
     document.body.dataset.reportError=e.message==='empty'?'empty':'failed';
     REPORT=null; renderAll();
     document.querySelector('[data-i18n="sample"]').textContent=REAL_TEXT[lang].badge;
     return;
   }
 }
 document.querySelector('main').hidden=false;
 renderAll();
 for(const id of ['btn-pdf','btn-csv','btn-json']) $(id).disabled=false;
 const fmt=initialExport?params.get('fmt'):null;
 initialExport=false;
 if(fmt==='pdf') setTimeout(()=>window.print(),700);
 else if(fmt==='csv'||fmt==='json') setTimeout(()=>$('btn-'+fmt).click(),400);
}
boot();
</script>
